apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: movies-destination-rule
  namespace: movies
spec:
  host: movieinfo.movies.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true
        failoverPriority:
          - "topology.kubernetes.io/zone"
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 1s
      baseEjectionTime: 1m
